[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zall"
version = "0.1.0"
description = "A falsifiable, reproducible coding agent CLI — model-agnostic, chain-hashed, replayable. Features LSP integration, CodeGraph code intelligence, sandbox isolation, plugin system, and MCP support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "qinrayn (Yuhan Zhang)" }]
keywords = [
    "coding-agent", "cli", "ai", "llm", "developer-tools", "reproducible",
    "code-assistant", "agent", "automation", "lsp", "code-intelligence",
    "sandbox", "mcp", "plugin-system", "chain-hash",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "cryptography>=42",
    "httpx>=0.24",
    "rich>=13",
    "prompt_toolkit>=3.0",
    "tomli>=2.0; python_version < '3.11'",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.7",
    "ruff>=0.1",
    "pytest-cov>=4.0",
]
bs4 = [
    "beautifulsoup4>=4.0",
]
images = [
    "pillow>=10.0",
]
tui = [
    "textual>=8.0.0",
]
all = [
    "zall[dev,bs4,images,tui]",
]

[project.urls]
Homepage = "https://github.com/qinrayn/zall"
Repository = "https://github.com/qinrayn/zall"
Documentation = "https://github.com/qinrayn/zall#readme"
Changelog = "https://github.com/qinrayn/zall/blob/master/CHANGELOG.md"
Issues = "https://github.com/qinrayn/zall/issues"
CI = "https://github.com/qinrayn/zall/actions"

[project.scripts]
zall = "zall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
# 模型无关的 CI 即使是 mypy 检验也强约束 (见 IMPL.md IPR-3)

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# CI 将加自定义规则禁止 core/ 出现 openai / anthropic 等 import (IPR-3)
# 见 scripts/check_ipr3.py
ignore = [
    "E702",  # multiple-statements-on-one-line-semicolon: TUI 键处理 `event.stop(); event.prevent_default()` 惯用
    "E741",  # ambiguous-variable-name: 少量 l/I/O 命名, 不阻断
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # __init__ 常做 re-export, 不删"未用" import
"tests/**" = ["F401", "F841", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["zall"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
	    "pragma: no cover",
	    "if __name__ == .__main__.:",
	    "raise AssertionError",
	    "raise NotImplementedError",
	]

# ═══════════════════════════════════════════════════════════════════════════════
# Plugin entry-point discovery (MASTER.md §12.1 + §8 生态建设)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Third-party packages can register tools and extensions for automatic discovery
# by declaring entry-points in their pyproject.toml:
#
#   [project.entry-points."zall.tools"]
#   my_tool = "my_package.module:tool_factory"
#
#   [project.entry-points."zall.extensions"]
#   my_extension = "my_package.module:extension_factory"
#
# Entry-point semantics:
#   - group "zall.tools":     factory() -> Tool instance (zall.core.tool.Tool protocol)
#   - group "zall.extensions": factory() -> Extension instance (zall.core.extension.Extension protocol)
#   - factory is a callable (typically a class constructor or function).
#   - factory receives no arguments; parameterless construction only.
#
# Discovery:
#   - zall scans these groups at startup via importlib.metadata.entry_points().
#   - Each factory is called in isolation: a failing factory is logged and skipped.
#   - Plugin tools are auto-assigned ToolNamespace.PLUGIN unless they declare otherwise.
#   - Built-in tools with the same tool_id take priority over plugin tools.
#   - Plugin tool versions are recorded in the registry (reuses §12 versioning).
#
# Local plugins (non-entry-point):
#   - A manifest.toml file in a plugin directory can declare tools manually.
#   - See src/zall/core/plugin_loader.py for manifest format.
#
# Note: zall itself does NOT register its built-in tools via entry-points.
# Built-in tools are registered directly in cli/orchestrator.py. The entry-point
# mechanism is exclusively for third-party plugins.